name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        # Without this the app runs in paste-only mode — see
        # services/ninja-proxy/README.md for how to set it.
        env:
          NEXT_PUBLIC_NINJA_PROXY_BASE: ${{ vars.NEXT_PUBLIC_NINJA_PROXY_BASE }}
        run: npm run build --workspace @poe2/web
      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll
      # enablement: true creates the Pages site through the API when it is not
      # already configured. Added after a deploy failed with "Get Pages site
      # failed ... verify that the repository has Pages enabled", which took the
      # live site down even though the build itself succeeded. The workflow
      # already holds `pages: write`, which is what this needs.
      #
      # If this still fails, Pages is disabled at a level a workflow cannot
      # reach and it must be turned on in Settings -> Pages, source
      # "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
